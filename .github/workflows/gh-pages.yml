name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only site files (HTML, CSS, JS, images)
          path: .
          ignore-glob: |
            .git/**
            .github/**
            data/**
            research/**
            *.json
            *.md
            *.py
            *.toml
            *.sh
            *.txt
            .gitignore
            .python-version
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
