name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Create site directory
        run: |
          mkdir -p _site
          cp *.html _site/ 2>/dev/null || true
          cp research_methodology.html _site/research_methodology.html 2>/dev/null || true
          cp -r research/ _site/research/ 2>/dev/null || true
          cp -r data/ _site/data/ 2>/dev/null || true
          cp -r .github _site/ 2>/dev/null || true
          cp -r audit_fixes/ _site/audit_fixes/ 2>/dev/null || true
          cp *.md _site/ 2>/dev/null || true
          cp *.json _site/ 2>/dev/null || true
          cp *.txt _site/ 2>/dev/null || true
          cp *.sh _site/ 2>/dev/null || true
          cp *.toml _site/ 2>/dev/null || true
          cp *.py _site/ 2>/dev/null || true
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
